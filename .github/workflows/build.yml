name: Build HappyDev

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'FEATURES.md'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'FEATURES.md'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: main

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install build tools
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        run: npm ci --arch=x64 --platform=linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        run: npm run compile

  package-macos:
    name: Package (macOS Intel)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        run: npm ci --arch=x64 --target_arch=x64
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS x64 app
        run: npm run gulp -- vscode-darwin-x64
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip app bundle
        working-directory: .
        run: ditto -c -k --sequesterRsrc --keepParent "VSCode-darwin-x64" "HappyDev-darwin-x64.zip"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: HappyDev-darwin-x64
          path: HappyDev-darwin-x64.zip
          retention-days: 14

      - name: Update download link on site
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          path = "site/download.html"
          content = open(path, encoding="utf-8").read()

          content = re.sub(
              r'href="https://github\.com/[^"]+/actions/runs/\d+/artifacts/\d+"',
              f'href="{os.environ["ARTIFACT_URL"]}"',
              content,
          )
          content = re.sub(
              r"latest build: run #\d+",
              f'latest build: run #{os.environ["RUN_ID"]}',
              content,
          )

          open(path, "w", encoding="utf-8").write(content)
          PYEOF

          if git diff --quiet -- site/download.html; then
            echo "No change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/download.html
            git commit -m "Update download link to run #${RUN_ID} [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "push failed, retrying ($i)..."
              sleep $((RANDOM % 10 + 1))
            done
          fi
